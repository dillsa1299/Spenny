# Local dev: PostgreSQL (+ optional Mailpit). API and Vite run on the host (Visual Studio or CLI).
# CI adds api + client via docker-compose.ci.yml.
services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: spenny-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  postgres:
    image: postgres:16
    container_name: spenny-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - spenny_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  spenny_pgdata:
