# Manual production deploy on the self-hosted runner (Actions → Run workflow).
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch or tag to deploy
        default: main
        required: true
      confirm:
        description: Type deploy to confirm
        required: true

jobs:
  deploy:
    if: inputs.confirm == 'deploy'
    runs-on: [self-hosted, spenny]
    environment: production
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: spenny-prod
    steps:
      - name: Checkout ref to deploy
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: Write environment file from GitHub secret
        env:
          SPENNY_DOTENV: ${{ secrets.SPENNY_DOTENV }}
        run: |
          env_path="${RUNNER_TEMP}/spenny.env"
          echo "SPENNY_ENV_FILE=${env_path}" >> "$GITHUB_ENV"
          if [ -z "$SPENNY_DOTENV" ]; then
            echo "Secret SPENNY_DOTENV is not set on the production environment."
            exit 1
          fi
          printf '%s\n' "$SPENNY_DOTENV" > "$env_path"
          chmod 600 "$env_path"

      - name: Deploy stack
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            -f compose/docker-compose.deploy.yml \
            --env-file "$SPENNY_ENV_FILE" \
            -p "$COMPOSE_PROJECT_NAME" \
            up -d --build

      - name: Health check
        run: |
          port="$(grep -E '^SPENNY_CLIENT_HOST_PORT=' "$SPENNY_ENV_FILE" | head -1 | cut -d= -f2- | tr -d '\r')"
          port="${port:-8081}"
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${port}/api/health" && curl -sf "http://127.0.0.1:${port}/"; then
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become ready in time"
          exit 1

      - name: Compose logs on failure
        if: failure()
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            -f compose/docker-compose.deploy.yml \
            --env-file "$SPENNY_ENV_FILE" \
            -p "$COMPOSE_PROJECT_NAME" \
            logs
